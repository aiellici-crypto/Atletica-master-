<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punteggi CdS Master</title>
<meta name="description" content="Calcolo del punteggio CdS Master maschili e femminili a partire da sesso, specialità, categoria e prestazione.">
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1c1f24;
    --muted: #5d6570;
    --border: #d7dbe0;
    --accent: #0b6bcb;
    --accent-soft: #e6f0fb;
    --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417;
      --card: #1c1f24;
      --text: #eceef1;
      --muted: #9aa3ad;
      --border: #333941;
      --accent: #5aa7f0;
      --accent-soft: #1b2a3a;
      --error: #f97066;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: grid;
    gap: 16px;
  }
  label { display: grid; gap: 6px; font-weight: 600; font-size: .95rem; }
  select, input {
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    width: 100%;
  }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  [aria-invalid="true"] { border-color: var(--error); }
  .hint { font-weight: 400; color: var(--muted); font-size: .85rem; }
  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 8px;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  #risultato {
    margin-top: 20px;
    border-radius: 12px;
    padding: 20px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    text-align: center;
  }
  #risultato[hidden] { display: none; }
  .titolo { margin: 0 0 8px; font-size: 1.1rem; font-weight: 700; letter-spacing: .05em; }
  .punti { font-size: 3rem; font-weight: 700; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .etichetta { color: var(--muted); font-size: .9rem; }
  .dettagli { margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .errore { color: var(--error); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Punteggi CdS Master</h1>
  <p class="sub">Tabelle Master maschili e femminili: scegli sesso, specialità e categoria, inserisci la prestazione.</p>

  <form id="calcolo" novalidate>
    <label>Sesso
      <select id="sesso"></select>
    </label>
    <label>Specialità
      <select id="gara"></select>
    </label>
    <label>Categoria
      <select id="categoria"></select>
    </label>
    <label>Prestazione
      <input id="prestazione" autocomplete="off" inputmode="decimal">
      <span class="hint" id="formato"></span>
    </label>
    <button type="submit">Calcola punteggio</button>
  </form>

  <section id="risultato" aria-live="polite" hidden></section>
</main>

<script src="data/punteggi.js"></script>
<script>
(function () {
  var sessi = window.PUNTEGGI.sessi;
  var selSesso = document.getElementById("sesso");
  var selGara = document.getElementById("gara");
  var selCat = document.getElementById("categoria");
  var input = document.getElementById("prestazione");
  var formato = document.getElementById("formato");
  var risultato = document.getElementById("risultato");

  var campi = [selSesso, selGara, selCat, input];

  // Svuota una tendina lasciando solo la voce iniziale "Scegli ..." (valore vuoto).
  function svuota(sel, testo) {
    sel.innerHTML = "";
    var o = new Option(testo, "");
    o.disabled = true;
    sel.add(o);
    sel.value = "";
  }

  svuota(selSesso, "Scegli il sesso");
  sessi.forEach(function (s, i) {
    selSesso.add(new Option(s.nome, i));
  });

  function garaCorrente() {
    if (selSesso.value === "" || selGara.value === "") return null;
    return sessi[selSesso.value].gare[selGara.value];
  }
  function tabellaCorrente() {
    var g = garaCorrente();
    return g && selCat.value !== "" ? g.categorie[selCat.value] : null;
  }

  // Converte "1h07:10.37", "3:45.20", "3'45\"20", "12.3", "12,34" in centesimi.
  // Sulla tastiera numerica del telefono mancano i due punti: per le corse si accetta
  // anche solo virgola/punto, es. "1,41,41" = 1:41,41 e "1,07,10,37" = 1h07:10,37.
  function leggiPrestazione(testo, tipo) {
    var t = testo.trim().replace(/\s+/g, "").replace(/,/g, ".").replace(/[''’]/g, ":").replace(/["”]/g, ".");
    if (tipo === "corsa" && /^\d+(\.\d+){2,3}$/.test(t)) {
      var p = t.split(".");
      t = (p.length === 4 ? p[0] + "h" : "") + p[p.length - 3] + ":" + p[p.length - 2] + "." + p[p.length - 1];
    }
    var m = t.match(/^(?:(\d+)h)?(?:(\d+):)?(\d+)(?:\.(\d{1,2}))?$/i);
    if (!m) return null;
    if (tipo === "concorso" && (m[1] || m[2])) return null;
    var ore = +(m[1] || 0), min = +(m[2] || 0), sec = +m[3];
    if ((m[1] || m[2]) && sec >= 60) return null;
    if (m[1] && min >= 60) return null;
    var cent = m[4] ? +(m[4] + "0").slice(0, 2) : 0;
    return ((ore * 60 + min) * 60 + sec) * 100 + cent;
  }

  function mostra(v, tipo) {
    if (tipo === "concorso") return (v / 100).toFixed(2).replace(".", ",") + " m";
    var cent = v % 100, s = Math.floor(v / 100);
    var ore = Math.floor(s / 3600), min = Math.floor(s / 60) % 60, sec = s % 60;
    var c = (cent < 10 ? "0" : "") + cent;
    if (!ore && !min) return sec + "," + c;
    var ss = (sec < 10 ? "0" : "") + sec;
    if (!ore) return min + ":" + ss + "," + c;
    return ore + "h" + (min < 10 ? "0" : "") + min + ":" + ss + "," + c;
  }

  // La tabella va dalla prestazione migliore alla peggiore. Si prende la prima riga
  // non migliore della prestazione ottenuta (tempo >= per le corse, misura <= per i concorsi).
  function calcola(tab, v, tipo) {
    var peggiore = function (a, b) { return tipo === "corsa" ? a >= b : a <= b; };
    var lo = 0, hi = tab.length;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (peggiore(tab[mid][0], v)) hi = mid; else lo = mid + 1;
    }
    return lo; // indice in tab, oppure tab.length se sotto la soglia minima
  }

  // Cambiando sesso si resta, se esiste, sulla stessa specialità.
  function aggiornaGare() {
    var prec = selGara.value !== "" ? selGara.options[selGara.selectedIndex].text : null;
    svuota(selGara, "Scegli la specialità");
    if (selSesso.value !== "") {
      sessi[selSesso.value].gare.forEach(function (g, i) {
        selGara.add(new Option(g.nome, i));
        if (g.nome === prec) selGara.value = i;
      });
    }
    aggiornaCategorie();
  }

  function aggiornaCategorie() {
    // stessa fascia d'età se disponibile (MM50 <-> MF50)
    var g = garaCorrente(), eta = selCat.value.slice(2);
    svuota(selCat, "Scegli la categoria");
    if (g) {
      Object.keys(g.categorie).forEach(function (c) {
        selCat.add(new Option(c, c));
        if (eta && c.slice(2) === eta) selCat.value = c;
      });
    }
    aggiornaFormato();
  }

  function aggiornaFormato() {
    var g = garaCorrente(), tab = tabellaCorrente();
    risultato.hidden = true;
    if (!tab) {
      input.placeholder = "";
      formato.textContent = "Scegli sesso, specialità e categoria per vedere il formato.";
      return;
    }
    var medio = tab[Math.floor(tab.length / 2)][0];
    var unita = g.tipo === "concorso" ? "metri" : medio >= 6000 ? "min:sec,centesimi" : "secondi,centesimi";
    input.placeholder = mostra(medio, g.tipo).replace(" m", "");
    var alt = g.tipo === "corsa" && medio >= 6000 ? " (oppure " + input.placeholder.replace(/[:h]/g, ",") + ")" : "";
    formato.textContent = "Formato: " + unita + ", es. " + input.placeholder + alt + ". Tabella da " + mostra(tab[0][0], g.tipo) +
      " (" + tab[0][1] + " pt) a " + mostra(tab[tab.length - 1][0], g.tipo) + " (" + tab[tab.length - 1][1] + " pt).";
  }

  function scrivi(html) { risultato.innerHTML = html; risultato.hidden = false; }

  document.getElementById("calcolo").addEventListener("submit", function (e) {
    e.preventDefault();
    var vuoti = campi.filter(function (c) { return c.value.trim() === ""; });
    campi.forEach(function (c) { c.setAttribute("aria-invalid", vuoti.indexOf(c) >= 0); });
    if (vuoti.length) {
      scrivi('<p class="errore">Compila tutti i campi</p>');
      vuoti[0].focus();
      return;
    }
    var g = garaCorrente(), tab = tabellaCorrente();
    var v = leggiPrestazione(input.value, g.tipo);
    if (v === null || v === 0) {
      scrivi('<p class="errore">Prestazione non valida.</p><p class="dettagli">' + formato.textContent + "</p>");
      return;
    }
    var i = calcola(tab, v, g.tipo);
    var intro = '<h2 class="titolo">PUNTEGGIO</h2><div class="etichetta">' + g.nome + " · " + selCat.value + " · " + mostra(v, g.tipo) + "</div>";
    if (i >= tab.length) {
      scrivi(intro + '<div class="punti">0</div><div class="etichetta">punti</div>' +
        '<p class="dettagli">Prestazione oltre il limite della tabella (' + mostra(tab[tab.length - 1][0], g.tipo) +
        " = " + tab[tab.length - 1][1] + " pt).</p>");
      return;
    }
    var riga = tab[i], dettagli;
    if (i === 0 && riga[0] !== v) {
      dettagli = "Prestazione migliore del massimo in tabella: punteggio massimo assegnato.";
    } else {
      dettagli = riga[0] === v ? "Valore presente in tabella." :
        "Valore non presente in tabella: si usa la riga " + mostra(riga[0], g.tipo) + ".";
      // prima riga con più punti, cioè la prestazione necessaria per salire di punteggio
      var j = i - 1;
      while (j >= 0 && tab[j][1] === riga[1]) j--;
      if (j >= 0) dettagli += " Per " + tab[j][1] + " pt serve " + mostra(tab[j][0], g.tipo) + ".";
    }
    scrivi(intro + '<div class="punti">' + riga[1] + '</div><div class="etichetta">punti</div>' +
      '<p class="dettagli">' + dettagli + "</p>");
  });

  campi.forEach(function (c) {
    c.addEventListener(c === input ? "input" : "change", function () { c.removeAttribute("aria-invalid"); });
  });
  selSesso.addEventListener("change", aggiornaGare);
  selGara.addEventListener("change", aggiornaCategorie);
  selCat.addEventListener("change", aggiornaFormato);
  aggiornaGare();
})();
</script>
</body>
</html>
